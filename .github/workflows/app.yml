name: app

on:
  push:
    branches: [main, master, 'claude/**']
    paths: ['tools/app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check embedded PowerShell syntax
        shell: pwsh
        run: |
          python - <<'PY'
          import re
          src = open('tools/app/droidvm_gpu.py', encoding='utf-8').read()
          out = []
          for name in ('STATIC_PS', 'LIVE_PS'):
              m = re.search(name + r' = r"""(.*?)"""', src, re.S)
              out.append('$null = {' + m.group(1) + '}')
          open('ps_check.ps1', 'w', encoding='utf-8').write('\n'.join(out))
          PY
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/ps_check.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { Write-Error ("PS syntax: " + $_.Message + " @ line " + $_.Extent.StartLineNumber) }; exit 1 }
          "PowerShell syntax OK"

      - name: PyInstaller
        shell: pwsh
        run: |
          pip install pyinstaller==6.11.1
          cd tools/app
          "$env:GITHUB_RUN_NUMBER" | Set-Content -NoNewline build.txt
          "$env:GITHUB_RUN_NUMBER" | Set-Content -NoNewline dist-version.txt
          pyinstaller --onefile --noconsole --uac-admin --name DroidVM-GPU `
            --add-data "ui.html;." --add-data "build.txt;." droidvm_gpu.py
          Copy-Item dist-version.txt dist/version.txt
          Get-Item dist/DroidVM-GPU.exe | Format-List Name,Length
      - name: Release app-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag -R $env:GITHUB_REPOSITORY 2>$null
          gh release create app-latest tools/app/dist/DroidVM-GPU.exe tools/app/dist/version.txt -R $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA --title "DroidVM GPU app (latest)" `
            --notes "Панель управления DroidVM GPU (неофициально). Сборка $env:GITHUB_SHA."
