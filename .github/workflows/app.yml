name: app

on:
  push:
    branches: [main, master, 'claude/**']
    paths: ['tools/app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyInstaller
        shell: pwsh
        run: |
          pip install pyinstaller==6.11.1
          cd tools/app
          pyinstaller --onefile --noconsole --uac-admin --name DroidVM-GPU `
            --add-data "ui.html;." droidvm_gpu.py
          Get-Item dist/DroidVM-GPU.exe | Format-List Name,Length
      - name: Release app-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag -R $env:GITHUB_REPOSITORY 2>$null
          gh release create app-latest tools/app/dist/DroidVM-GPU.exe -R $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA --title "DroidVM GPU app (latest)" `
            --notes "Панель управления DroidVM GPU (неофициально). Сборка $env:GITHUB_SHA."
